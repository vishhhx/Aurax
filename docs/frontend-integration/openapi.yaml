      responses:
        "200":
          description: Ticker
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/Ticker" } }
  /api/v1/market/markets/{symbol}/price:
    get:
      operationId: getPrice
      tags: [market]
      summary: Last trade price
      security: []
      parameters: [{ $ref: "#/components/parameters/Symbol" }]
      responses:
        "200":
          description: Price (null before the first trade)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          symbol: { type: string }
                          price: { type: [string, "null"] }
                          timestamp: { type: [integer, "null"] }
  /api/v1/market/markets/{symbol}/candles:
    get:
      operationId: getCandles
      tags: [market]
      summary: Candles, oldest first
      security: []
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - { name: interval, in: query, required: true, schema: { type: string, enum: [1m, 5m, 15m, 1h, 1d] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
        - { name: startTime, in: query, schema: { type: integer }, description: Unix ms }
        - { name: endTime, in: query, schema: { type: integer }, description: Unix ms }
      responses:
        "200":
          description: Candles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/Candle" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/market/markets/{symbol}/trades:
    get:
      operationId: getRecentTrades
      tags: [market]
      summary: Recent public trades, newest first (memory)
      security: []
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Trades
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/PublicTrade" } } }
  /api/v1/market/markets/{symbol}/historical-trades:
    get:
      operationId: getHistoricalTrades
      tags: [market]
      summary: Public trade history (cursor pagination)
      security: []
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
        - { name: startTime, in: query, schema: { type: integer } }
        - { name: endTime, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string }, description: nextCursor from the previous page }
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          trades: { type: array, items: { $ref: "#/components/schemas/PublicTrade" } }
                          nextCursor: { type: [string, "null"] }
                          limit: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/market/markets/{symbol}/trades/{tradeId}:
    get:
      operationId: getPublicTrade
      tags: [market]
      summary: One public trade
      security: []
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - { name: tradeId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Trade
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/PublicTrade" } }
        "404": { $ref: "#/components/responses/NotFound" }

