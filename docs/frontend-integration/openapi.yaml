                          bidQuantity: { type: [string, "null"] }
                          askPrice: { type: [string, "null"] }
                          askQuantity: { type: [string, "null"] }
                          sequenceNumber: { type: string }
        "503": { $ref: "#/components/responses/NotReady" }
  /api/v1/market/markets/{symbol}/ticker:
    get:
      operationId: getTicker
      tags: [market]
