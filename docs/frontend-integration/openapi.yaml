      parameters:
        - $ref: "#/components/parameters/Symbol"
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: view, in: query, schema: { type: string, enum: [published] }, description: "Exactly the top-N view that WS depth deltas describe" }
