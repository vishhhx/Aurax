      responses:
        "200":
          description: Markets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/MarketInfo" } } }
