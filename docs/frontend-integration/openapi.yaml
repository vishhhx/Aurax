      security: []
      responses:
        "200":
          description: Tickers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/Ticker" } } }
        "503": { $ref: "#/components/responses/NotReady" }
  /api/v1/market/markets/{symbol}:
    get:
      operationId: getMarket
      tags: [market]
