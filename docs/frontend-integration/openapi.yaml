      parameters: [{ $ref: "#/components/parameters/Symbol" }]
      responses:
        "200":
          description: Ticker
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/Ticker" } }
        "503": { $ref: "#/components/responses/NotReady" }
  /api/v1/market/markets/{symbol}/ticker/24hr:
    get:
      operationId: getTicker24hr
      tags: [market]
      summary: Alias of /ticker
