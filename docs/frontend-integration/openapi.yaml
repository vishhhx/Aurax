      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          symbol: { type: string }
                          status: { type: string }
                          orderBookSequenceNumber: { type: [string, "null"] }
                          orderBookUpdatedAt: { type: [integer, "null"] }
                          lastTradeTimestamp: { type: [integer, "null"] }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/market/markets/{symbol}/orderbook:
    get:
      operationId: getOrderBook
      tags: [market]
      summary: Order book depth
